# @package _global_

constants:
  input_channels: 3
  n_classes: 0
  image_size: 128

latent_diffusion: True

dataset:
  _target_: utils.samples_with_embeddings_folder_dataset.SamplesWithEmbeddingsFolderDataset
  samples_root: ${paths.data_root}/geners_plus_fixbone_sort
  # ${paths.data_root}/...
  
  embeddings_root: ${paths.data_root}/caption/embeddings_clipreid
  # ${paths.data_root}/...
  sample_file_ending: ".jpg"
  embedding_file_ending: ".npy"
  embedding_loader:
    _target_: utils.samples_with_embeddings_folder_dataset.NumpyEmbeddingLoader
  sample_loader:
    _target_: utils.samples_with_embeddings_folder_dataset.PILImageLoader
  sample_transform:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size:
        - ${constants.image_size}
        - ${constants.image_size}
      - _target_: torchvision.transforms.ToTensor
      
                                                   
